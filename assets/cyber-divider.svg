<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="42" viewBox="0 0 1200 42" role="img" aria-label="Cyber divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020617" stop-opacity="0"/>
      <stop offset=".18" stop-color="#0f766e"/>
      <stop offset=".5" stop-color="#22c55e"/>
      <stop offset=".82" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M0 21H420l18-12 18 24 20-24 18 12h212l18-12 18 24 20-24 18 12h420" fill="none" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="600" cy="21" r="5" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;1;.55" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="19" width="80" height="4" rx="2" fill="#22c55e" opacity=".8" filter="url(#glow)">
    <animate attributeName="x" values="0;1120;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
